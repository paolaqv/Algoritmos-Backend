<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATLAB GUI Launcher</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap">
    <style>
        :root {
            --primary: #5e35b1;    /* Púrpura moderno */
            --secondary: #00acc1;  /* Turquesa */
            --dark: #1a237e;
            --light: #e8eaf6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h1 {
            color: var(--dark);
            margin-bottom: 30px;
            font-size: 2.5rem;
            font-weight: 600;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .btn {
            border: none;
            outline: none;
            padding: 18px 24px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            color: white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(255, 255, 255, 0.2), transparent);
            transition: all 0.3s;
        }

        .btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .btn:hover::after {
            background: linear-gradient(rgba(255, 255, 255, 0.4), transparent);
        }

        .btn-fuzzy {
            background: linear-gradient(45deg, #ff6b6b, #ff8e53);
        }

        .btn-laplace {
            background: linear-gradient(45deg, #4facfe, #00f2fe);
        }

        .btn-ilaplace {
            background: linear-gradient(45deg, #a18cd1, #fbc2eb);
        }

        .status {
            margin-top: 30px;
            padding: 15px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.7);
            display: none;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            h1 {
                font-size: 1.8rem;
            }
            .btn {
                padding: 15px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Herramientas MATLAB</h1>
        <div class="btn-grid">
            <button class="btn btn-fuzzy" onclick="openGUI('fuzzy')">
                <i class="fas fa-project-diagram"></i> Fuzzy Logic
            </button>
            <button class="btn btn-laplace" onclick="openGUI('laplace')">
                <i class="fas fa-calculator"></i> Laplace
            </button>
            <button class="btn btn-ilaplace" onclick="openGUI('ilaplace')">
                <i class="fas fa-infinity"></i> Laplace Inversa
            </button>
        </div>
        <div class="status" id="status"></div>
    </div>

    <!-- Font Awesome para íconos -->
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

    <script>
        async function openGUI(action) {
            const statusEl = document.getElementById('status');
            statusEl.style.display = 'block';
            statusEl.innerHTML = `<p>Abriendo MATLAB ${action} GUI...</p>`;
            
            try {
                const response = await fetch(`/api/matlab/open_${action}`, { method: 'POST' });
                const result = await response.json();
                statusEl.innerHTML = `<p style="color: #4CAF50;">✓ ${result.status}</p>`;
            } catch (error) {
                statusEl.innerHTML = `<p style="color: #f44336;">✗ Error: ${error.message}</p>`;
            }
            
            setTimeout(() => {
                statusEl.style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
